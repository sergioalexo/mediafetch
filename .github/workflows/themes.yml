name: Validate themes

on:
  pull_request:
    paths:
      - "themes/**"
  push:
    branches: [main]
    paths:
      - "themes/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node themes/validate.mjs
