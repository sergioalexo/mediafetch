[package]
name = "mediafetch"
version = "0.5.0"
description = "A yt-dlp + FFmpeg GUI"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "fs"] }
# Same reqwest/rustls stack tauri-plugin-updater already ships, so the app
# carries one HTTP client and one TLS implementation instead of two. TLS roots
# come from the OS store (rustls-platform-verifier), and the ring crypto
# provider is installed once at startup in main().
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
# zip 4 matches tauri-plugin-updater's; only extraction is needed.
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
tauri-winrt-notification = "0.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

